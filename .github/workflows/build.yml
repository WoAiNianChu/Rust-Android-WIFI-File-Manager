name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NDK_VERSION: "25.2.9519653"
      CARGO_NDK_VERSION: "4.1.2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android NDK
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo-ndk binary
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-binary-${{ env.CARGO_NDK_VERSION }}

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version ${CARGO_NDK_VERSION}

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src/main/rust/target
          key: ${{ runner.os }}-cargo-${{ env.NDK_VERSION }}-${{ env.CARGO_NDK_VERSION }}-${{ hashFiles('app/src/main/rust/Cargo.toml', 'app/src/main/rust/rocket_seek_stream/Cargo.toml', 'app/src/main/rust/Cargo.lock', 'app/src/main/rust/rocket_seek_stream/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.NDK_VERSION }}-${{ env.CARGO_NDK_VERSION }}-

      - name: Build Rust library
        working-directory: app/src/main/rust
        run: cargo ndk -t arm64-v8a --platform 30 build --release

      - name: Copy librust.so to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp app/src/main/rust/target/aarch64-linux-android/release/librust.so \
             app/src/main/jniLibs/arm64-v8a/librust.so

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
