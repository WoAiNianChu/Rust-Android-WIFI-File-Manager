plugins {
    id 'com.android.application'
}
android {
    namespace 'psycho.euphoria.killer'
    compileSdk 32

    defaultConfig {
        applicationId "psycho.euphoria.killer"
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName "1.0"
        ndk.abiFilters 'arm64-v8a'
        
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // https://github.com/arthenica/ffmpeg-kit
    // Upstream ffmpeg-kit artifacts were retired and are no longer resolvable from Maven Central.
    // Pin to a JitPack-published build that keeps the com.arthenica.ffmpegkit Java API used in this app.
    implementation 'com.github.leventyayla:ffmpeg-kit:v6.0-4-morph-full-16kb'
}
